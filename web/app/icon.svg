<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon: the bindu seal on the ink brand tile. The trishula smears at 16px; a
       closed ring with a pressed center reads at any size and is the verification mark
       users learn inside the product. Hex mirrors globals.css tokens (assets can't read
       CSS variables): ink #23201B, paper #FAF8F4. -->
  <rect width="32" height="32" rx="7" fill="#23201B"/>
  <circle cx="16" cy="15.5" r="8" fill="none" stroke="#FAF8F4" stroke-width="2.4"/>
  <circle cx="16" cy="15.5" r="3.2" fill="#FAF8F4"/>
</svg>
