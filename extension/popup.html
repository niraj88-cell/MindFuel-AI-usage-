<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light; }
    body { margin: 0; width: 300px; background: #FAF8F4; color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .wrap { padding: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .tile { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px;
      border-radius: 10px; background: #111827; color: #fff; flex: 0 0 auto; }
    .name { font-weight: 600; font-size: 15px; line-height: 1.1; }
    .sub { font-size: 10px; color: #6B7280; margin-top: 2px; letter-spacing: 0.03em; }
    .status { display: flex; align-items: flex-start; gap: 10px; padding: 12px;
      border: 1px solid rgba(0,0,0,0.07); border-radius: 12px; background: #fff; }
    .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; flex: 0 0 auto; background: #9CA3AF; }
    .dot.ok { background: #4CAF50; }
    .dot.warn { background: #D97706; }
    .dot.off { background: #9CA3AF; }
    .state { font-size: 13px; font-weight: 600; }
    .detail { font-size: 12px; color: #6B7280; margin-top: 2px; line-height: 1.45; }
    .synced { margin-top: 10px; min-height: 14px; font-size: 11px; color: #6B7280; text-align: center; }
    .note { margin-top: 10px; font-size: 11.5px; line-height: 1.45; padding: 9px 11px; border-radius: 10px;
      background: #FEF3C7; color: #92400E; display: none; }
    .btn { display: block; box-sizing: border-box; width: 100%; text-align: center; text-decoration: none;
      font: inherit; font-size: 13px; font-weight: 600; padding: 10px; border-radius: 10px; cursor: pointer;
      border: 1px solid transparent; margin-top: 12px; }
    .primary { background: #2E7D32; color: #fff; }
    .ghost { background: #fff; color: #374151; border: 1px solid rgba(0,0,0,0.12); }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .toggle { width: 100%; margin-top: 8px; background: #fff; color: #6B7280; border: 1px solid rgba(0,0,0,0.1);
      font: inherit; font-size: 12.5px; font-weight: 600; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
    .priv { margin-top: 12px; font-size: 11px; color: #6B7280; display: flex; align-items: center; gap: 5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="tile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 10 L12 21" /><path d="M8.5 10 L15.5 10" /><path d="M12 10 L12 3.4" />
          <path d="M8.5 10 C 8.5 6.5 9 5 10 4.3" /><path d="M15.5 10 C 15.5 6.5 15 5 14 4.3" />
          <circle cx="12" cy="14.6" r="1.5" fill="currentColor" stroke="none" />
        </svg>
      </span>
      <span>
        <div class="name">SatyaShift</div>
        <div class="sub">&#2360;&#2340;&#2381;&#2351; &middot; truth</div>
      </span>
    </div>

    <div class="status">
      <span id="dot" class="dot off" aria-hidden="true"></span>
      <span aria-live="polite">
        <div id="state" class="state">Checking&hellip;</div>
        <div id="detail" class="detail">Reading your session.</div>
      </span>
    </div>

    <div id="synced" class="synced"></div>
    <div id="note" class="note"></div>

    <button id="session" class="btn primary" type="button" style="display:none">Start deep session</button>
    <a id="open" class="btn ghost" href="#">Open SatyaShift</a>
    <button id="pause" class="toggle" type="button">Pause tracking</button>

    <div class="priv">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" />
      </svg>
      Domain only. Never the page or what you type.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
